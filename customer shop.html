<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BoxForLess | Wholesale Shop</title>
<style>
:root{--bg:#f6f4f1;--cd:#fff;--tx:#1d1b19;--mu:#6e6a65;--bd:#e7e2dc;--pr:#c2410c;--on:#fff;--ok:#15803d;--wn:#b45309;--er:#b91c1c;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13110f;--cd:#1e1b18;--tx:#f1ede8;--mu:#a39d95;--bd:#2f2b27;--pr:#f97316;--on:#1e1b18;--ok:#4ade80;--wn:#fbbf24;--er:#f87171}}
:root[data-theme="dark"]{--bg:#13110f;--cd:#1e1b18;--tx:#f1ede8;--mu:#a39d95;--bd:#2f2b27;--pr:#f97316;--on:#1e1b18;--ok:#4ade80;--wn:#fbbf24;--er:#f87171}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px}.logo span{color:var(--pr)}
nav{display:flex;gap:4px;flex:1}nav button{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;padding:8px 12px;border-radius:99px;cursor:pointer}
nav button.on{background:var(--pr);color:var(--on)}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.s{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.z{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;min-height:42px}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.mu{color:var(--mu)}.bad{color:var(--er)}.good{color:var(--ok)}.right{text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.p{display:flex;flex-direction:column;gap:6px;position:relative;margin:0}
.pic{height:90px;border-radius:10px;background:color-mix(in srgb,var(--pr) 10%,var(--bg));display:grid;place-items:center;font-size:42px}
.fav{position:absolute;top:10px;right:10px;background:var(--cd);border:1px solid var(--bd);border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:16px}
.add{display:flex;gap:8px;margin-top:auto}.add input{width:72px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,currentColor 13%,transparent)}
.Pending{color:var(--wn)}.Confirmed,.Packed{color:var(--pr)}.Delivered{color:var(--ok)}.Cancelled{color:var(--er)}
.tl{display:flex;margin:12px 0 4px}.tl div{flex:1;text-align:center;font-size:12px;color:var(--mu);position:relative}
.tl div:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--bd);margin:0 auto 4px;position:relative;z-index:1}
.tl div:after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--bd)}.tl div:first-child:after{display:none}
.tl .d{color:var(--tx)}.tl .d:before,.tl .d:after{background:var(--pr)}
.bar{height:10px;border-radius:99px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.md{background:var(--cd);border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
@media(min-width:640px){.ov{align-items:center;padding:16px}.md{border-radius:var(--r)}}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.code{font-family:ui-monospace,Consolas,monospace;letter-spacing:.14em;text-align:center;font-size:18px;font-weight:700}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:99;max-width:90%}
#t.s{opacity:1}
@media print{header,main,#t{display:none}.ov{position:static;background:none}.md{max-height:none}.no{display:none}}
</style>
</head>
<body><div id="app"></div><div id="t"></div>
<script>
"use strict";
/* Shares data with boxforless-admin.html (same browser, same key). Replace with API calls in production. */
const KEY="bfl_admin_v1",$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GH=n=>"GH₵ "+Number(n).toLocaleString("en-GH",{minimumFractionDigits:2,maximumFractionDigits:2});
const day=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
function seed(){const c=[{code:"KOF7A2X9",name:"Kofi Mensah Provisions",phone:"024 000 1111",credit:15000,status:"Active"},{code:"AMA3B8Q4",name:"Ama Serwaa Supermarket",phone:"055 000 2222",credit:40000,status:"Active"},{code:"YAW5C1M6",name:"Yaw Boateng Chop Bar",phone:"020 000 3333",credit:5000,status:"Suspended"}];
const p=[{sku:"RIC-25",name:"Perfumed Rice 25kg",per:1,price:420,stock:120},{sku:"OIL-12",name:"Vegetable Oil 1L",per:12,price:360,stock:80},{sku:"TOM-24",name:"Tomato Paste 70g",per:24,price:290,stock:12},{sku:"SGR-10",name:"Sugar 1kg",per:10,price:240,stock:60}];
const st=["Delivered","Delivered","Packed","Confirmed","Pending","Delivered","Cancelled"];
const o=Array.from({length:14},(_,i)=>({id:1001+i,code:c[i%3].code,date:day(6-i%7),status:st[i%7],items:[{sku:p[i%4].sku,name:p[i%4].name,qty:1+i%4,price:p[i%4].price},{sku:p[(i+1)%4].sku,name:p[(i+1)%4].name,qty:1+i%3,price:p[(i+1)%4].price}]}));
return{customers:c,products:p,orders:o,staff:[{name:"Brain Amponsah",role:"Admin"},{name:"Efua Owusu",role:"Sales"},{name:"Kwesi Adjei",role:"Warehouse"}],log:[],seq:1014,low:20}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}db=db||seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const CAT={RIC:["Grains & Rice","🍚"],OIL:["Oils","🫒"],TOM:["Canned & Sauces","🍅"],SGR:["Baking & Sugar","🍬"],WTR:["Drinks","💧"]};
const cat=p=>CAT[p.sku.slice(0,3)]||["Other","📦"];
const STEPS=["Pending","Confirmed","Packed","Delivered"];
const S={u:null,v:"shop",q:"",c:"All",fav:false,cart:{},modal:""};
const toast=m=>{const t=$("#t");t.textContent=m;t.className="s";setTimeout(()=>t.className="",2400)};
const pr=s=>db.products.find(x=>x.sku===s),tot=o=>o.items.reduce((s,i)=>s+i.qty*i.price,0);
const mine=()=>db.orders.filter(o=>o.code===S.u.code);
const used=()=>mine().filter(o=>["Pending","Confirmed","Packed"].includes(o.status)).reduce((s,o)=>s+tot(o),0);
const avail=()=>Math.max(0,S.u.credit-used());
const favs=()=>lsGet("bfl_fav_"+S.u.code,[]);
const lines=()=>Object.entries(S.cart).filter(([k])=>pr(k)).map(([sku,qty])=>({sku,name:pr(sku).name,qty,price:pr(sku).price}));
const ctot=()=>lines().reduce((s,i)=>s+i.qty*i.price,0);
const cnt=()=>Object.keys(S.cart).length;

function login(){return`<div class="login"><div class="logo" style="font-size:28px">Box<span>For</span>Less</div><p class="mu">Wholesale ordering for your shop. Enter the 8-character access code from your BoxForLess rep.</p><div class="card"><input id="cc" class="code" maxlength="8" placeholder="ACCESS CODE" autocomplete="off" aria-label="Access code"><p><button class="btn" data-a="login" style="width:100%">Enter shop</button></p><small class="mu">Demo codes: KOF7A2X9, AMA3B8Q4</small></div></div>`}
const V={
shop(){const f=favs(),cs=["All",...new Set(db.products.map(p=>cat(p)[0]))],q=S.q.toLowerCase();
const L=db.products.filter(p=>(S.c==="All"||cat(p)[0]===S.c)&&(!S.fav||f.includes(p.sku))&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)));
return`<input id="q" type="search" placeholder="Search products or SKU" value="${esc(S.q)}" aria-label="Search" style="margin-bottom:10px"><div class="chips"><button class="chip ${S.fav?"on":""}" data-a="favf">♥ Favourites</button>${cs.map(c=>`<button class="chip ${S.c===c?"on":""}" data-a="cat" data-id="${esc(c)}">${esc(c)}</button>`).join("")}</div>
<div class="grid">${L.map(p=>`<div class="card p"><button class="fav" data-a="fav" data-id="${p.sku}" aria-label="Favourite">${f.includes(p.sku)?"♥":"♡"}</button><div class="pic">${cat(p)[1]}</div><b>${esc(p.name)}</b><small class="mu">${p.per} unit${p.per>1?"s":""} per carton · ${esc(p.sku)}</small><div><b>${GH(p.price)}</b> <small class="mu">/ carton</small></div><small class="${p.stock<db.low?"bad":"good"}">${p.stock<1?"Out of stock":p.stock<db.low?"Only "+p.stock+" left":"In stock"}</small><div class="add"><input id="q-${p.sku}" type="number" min="1" max="${p.stock}" value="1" aria-label="Cartons"><button class="btn" data-a="add" data-id="${p.sku}" ${p.stock<1?"disabled":""} style="flex:1">Add</button></div></div>`).join("")||'<p class="mu">No products found.</p>'}</div>`},
orders(){const L=mine();return L.length?L.map(o=>{const i=STEPS.indexOf(o.status);return`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Order #${o.id}</b><span class="tag ${o.status}">${o.status}</span></div><div class="mu">${o.date} · ${o.items.reduce((s,x)=>s+x.qty,0)} cartons · <b style="color:var(--tx)">${GH(tot(o))}</b></div>
${o.status==="Cancelled"?"":`<div class="tl">${STEPS.map((s,k)=>`<div class="${k<=i?"d":""}">${s}</div>`).join("")}</div>`}<p style="margin:10px 0 0"><button class="btn s z" data-a="inv" data-id="${o.id}">Invoice</button> <button class="btn s z" data-a="again" data-id="${o.id}">Reorder</button></p></div>`}).join(""):'<div class="card mu">No orders yet. Your first order will appear here.</div>'},
account(){const u=S.u,pc=Math.min(100,used()/u.credit*100||0);return`<div class="card"><h3 style="margin-top:0">${esc(u.name)}</h3><div class="mu">${esc(u.phone)} · Code <b>${u.code}</b> · ${u.status}</div></div>
<div class="card"><b>Credit</b><div class="bar" style="margin:10px 0"><i style="width:${pc}%"></i></div><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><span>Limit: <b>${GH(u.credit)}</b></span><span>In use: <b>${GH(used())}</b></span><span>Available: <b class="good">${GH(avail())}</b></span></div></div>
<div class="card"><b>Need help?</b><p class="mu" style="margin-bottom:0">Contact your BoxForLess account manager to raise your credit limit or change your details.</p></div>`}};
function cartM(){const L=lines(),t=ctot(),over=t>avail();return`<div class="ov"><div class="md"><div style="display:flex;justify-content:space-between"><h3 style="margin:0">Your cart</h3><button class="btn s z" data-a="close">Close</button></div>${L.length?`<table>${L.map(i=>`<tr><td>${esc(i.name)}<br><small class="mu">${GH(i.price)} / ctn</small></td><td><input type="number" min="1" max="${pr(i.sku).stock}" value="${i.qty}" data-q="${i.sku}" style="width:70px" aria-label="Cartons"></td><td class="right">${GH(i.qty*i.price)}</td><td><button class="btn s z" data-a="rm" data-id="${i.sku}" aria-label="Remove">✕</button></td></tr>`).join("")}</table>
<p class="right" style="font-size:20px"><b>${GH(t)}</b></p><p class="right ${over?"bad":"mu"}">Available credit: ${GH(avail())}${over?" (order is over your limit)":""}</p><button class="btn" data-a="place" style="width:100%" ${over||S.u.status!=="Active"?"disabled":""}>Place order</button>${S.u.status!=="Active"?'<p class="bad">Your account is suspended. Please contact BoxForLess.</p>':""}`:'<p class="mu">Your cart is empty.</p>'}</div></div>`}
function invM(o){return`<div class="ov"><div class="md"><h3 style="margin:0">Invoice #${o.id}</h3><p class="mu">BoxForLess Wholesale<br>Billed to: ${esc(S.u.name)} · ${o.date}</p><table><tr><th>Item</th><th>Ctn</th><th>Price</th><th class="right">Total</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${GH(i.price)}</td><td class="right">${GH(i.qty*i.price)}</td></tr>`).join("")}<tr><td colspan="3"><b>Total due</b></td><td class="right"><b>${GH(tot(o))}</b></td></tr></table><p class="no" style="margin-bottom:0"><button class="btn" data-a="print">Print / Save PDF</button> <button class="btn s" data-a="close">Close</button></p></div></div>`}
function render(){const a=$("#app");if(!S.u){a.innerHTML=login();return}
a.innerHTML=`<header><div class="logo">Box<span>For</span>Less</div><nav>${[["shop","Shop"],["orders","Orders"],["account","Account"]].map(([k,l])=>`<button class="${S.v===k?"on":""}" data-a="nav" data-id="${k}">${l}</button>`).join("")}</nav><button class="btn z" data-a="cart">🛒 Cart (${cnt()})</button><button class="btn s z" data-a="out">Log out</button></header><main>${V[S.v]()}</main>${S.modal}`}
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{const k=e.target.dataset.q;if(k){const n=Math.floor(+e.target.value);if(!(n>0))delete S.cart[k];else S.cart[k]=Math.min(n,pr(k).stock);S.modal=cartM();render()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
const A={
login(){const lk=lsGet("bfl_lock",{n:0,until:0});if(Date.now()<lk.until)return toast("Too many attempts. Try again in "+Math.ceil((lk.until-Date.now())/1000)+"s");
const u=db.customers.find(c=>c.code===$("#cc").value.trim().toUpperCase());
if(!u){lk.n++;if(lk.n>=3){lk.until=Date.now()+30000;lk.n=0}lsSet("bfl_lock",lk);return toast("Invalid access code")}
lsSet("bfl_lock",{n:0,until:0});S.u=u;S.v="shop";S.cart={}},
out(){S.u=null;S.modal="";S.cart={}},nav(){S.v=id},cat(){S.c=id},favf(){S.fav=!S.fav},close(){S.modal=""},print(){window.print()},
fav(){const f=favs(),i=f.indexOf(id);i<0?f.push(id):f.splice(i,1);lsSet("bfl_fav_"+S.u.code,f)},
add(){const p=pr(id),n=Math.floor(+$("#q-"+id).value),t=(S.cart[id]||0)+n;if(!(n>0))return toast("Enter a valid quantity");if(t>p.stock)return toast("Only "+p.stock+" cartons in stock");S.cart[id]=t;toast(p.name+" added")},
cart(){S.modal=cartM()},rm(){delete S.cart[id];S.modal=cartM()},
place(){const L=lines();if(!L.length||S.u.status!=="Active")return;if(ctot()>avail())return toast("Over your credit limit");
for(const i of L)if(pr(i.sku).stock<i.qty)return toast("Not enough stock: "+i.name);
L.forEach(i=>pr(i.sku).stock-=i.qty);const o={id:++db.seq,code:S.u.code,date:day(0),status:"Pending",items:L};db.orders.unshift(o);
db.log.unshift({t:new Date().toLocaleString("en-GH"),u:S.u.name,m:"Order #"+o.id+" placed (customer portal)"});save();S.cart={};S.modal="";S.v="orders";toast("Order #"+o.id+" placed. We'll confirm shortly.")},
inv(){S.modal=invM(db.orders.find(o=>o.id==id))},
again(){const o=db.orders.find(x=>x.id==id);let miss=0;o.items.forEach(i=>{const p=pr(i.sku);if(p&&p.stock>0)S.cart[i.sku]=Math.min(i.qty,p.stock);else miss++});S.modal=cartM();if(miss)toast(miss+" item(s) no longer available")}};
A[a]&&A[a]();render()});
render();
</script>
</body>
</html>
