<!doctype html>
<html lang="en" data-theme-default="light" data-theme-toggle="false">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <script src="/js/theme-init.js"></script>
  <title>Sales Manager — Box for Less</title>
  <link rel="stylesheet" href="/css/backdrop.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/extras.css" />
  <link rel="stylesheet" href="/css/dark.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="stylesheet" href="/css/sales.css" />
  <link rel="stylesheet" href="/css/dashboard-pro.css" />
  <link rel="stylesheet" href="/css/print.css" media="print" />
</head>
<body class="adm sm-page">
  <div class="sm-layout">
    <div id="smScrim" class="sm-scrim" hidden></div>
    <aside id="smSidebar" class="sm-sidebar" aria-label="Sales Manager navigation">
      <a class="sm-brand" href="#dashboard" aria-label="Box for Less dashboard">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="m24 3 19 10.5v21L24 45 5 34.5v-21L24 3Z" fill="#0b2341"/>
          <path d="m5.5 13.5 18.5 10 18.5-10M24 24v20.5M15 8l19 11M33 8 14 19" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
        </svg>
        <span><b>BoxForLess</b><small>Bigger boxes. Better value.</small></span>
      </a>
      <nav class="sm-nav" aria-label="Main menu">
        <a href="#dashboard" data-route="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></a>
        <a href="#products" data-route="products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5v8l-9 5-9-5V8zM3.5 8.2 12 13l8.5-4.8M12 13v8"/></svg><span>Products</span></a>
        <a href="/catalog" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg><span>Catalog</span><span class="sm-nav-external" aria-label="opens in a new tab">↗</span></a>
        <a href="#requests" data-route="requests"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l3 3v15H4V3zM8 10h8M8 14h8M8 18h5"/></svg><span>Requests</span><span id="smPendingBadge" class="sm-nav-badge" hidden></span></a>
        <a href="#team" data-route="team"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/></svg><span>Team Performance</span></a>
        <a href="#targets" data-route="targets"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span>Sales Targets</span></a>
        <a href="#customers" data-route="customers"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/></svg><span>Customers</span></a>
        <a href="#imports" data-route="imports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 19v2h16v-2"/></svg><span>Imports</span></a>
      </nav>
      <div class="sm-sidebar-bottom">
        <a href="#settings" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4L7.3 15a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 2z"/></svg><span>Settings</span></a>
        <div class="sm-sidebar-note"><i aria-hidden="true"></i><span><b>Sales workspace</b><small>Read-only access</small></span></div>
      </div>
    </aside>

    <div class="sm-main">
      <header class="sm-top">
        <button id="smMenuToggle" class="sm-icon-btn sm-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="smSidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <form id="smSearchForm" class="sm-search" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
          <input id="smSearch" type="search" aria-label="Search products, customers, and requests" placeholder="Search products, customers, requests…" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
        <div class="sm-top-right">
          <button id="smNotifications" class="sm-icon-btn sm-notifications" type="button" aria-label="View pending requests">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
            <span id="smNotificationBadge" hidden></span>
          </button>
          <div class="sm-profile">
            <button id="userBtn" class="sm-profile-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu">
              <span class="sm-avatar" aria-hidden="true">SM</span>
              <span><b>Sales Manager</b><small>Team account</small></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="userMenu" class="sm-user-menu" role="menu" hidden>
              <a href="#settings" role="menuitem">Account &amp; access</a>
              <a href="/catalog" target="_blank" rel="noopener" role="menuitem">Open customer catalog</a>
              <button id="salesLogout" type="button" role="menuitem">Sign out</button>
            </div>
          </div>
        </div>
      </header>
      <main id="view" class="sm-view" tabindex="-1"></main>
      <footer class="sm-footer"><span>Box for Less Sales Manager</span><span>© Box for Less</span></footer>
    </div>
  </div>
  <script type="module" src="/js/sales.js"></script>
</body>
</html>
