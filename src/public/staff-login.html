<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Staff sign in — Box for Less</title>
  <link rel="stylesheet" href="/css/backdrop.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/extras.css" />
  <link rel="stylesheet" href="/css/dark.css" />
  <link rel="stylesheet" href="/css/print.css" media="print" />
</head>
<body>
  <main class="staff-login-wrap">
    <form id="staffLoginForm" class="card staff-login-card">
      <div class="logo staff-login-logo" role="img" aria-label="Box for Less">BFL</div>
      <h1>Staff sign in</h1>
      <p class="muted">Sign in to manage products and customer requests.</p>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <p id="loginError" class="errbox hidden" role="alert"></p>
      <button id="loginButton" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/js/boot-guard.js"></script>
  <script type="module" src="/js/staff-login.js"></script>
  <script type="module" src="/js/ui-extras.js"></script>
</body>
</html>
