<script>
"use strict";
/* Shares data with boxforless-admin.html (same browser, same key). Replace with API calls in production. */
const KEY="bfl_admin_v1",$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GH=n=>"GH₵ "+Number(n).toLocaleString("en-GH",{minimumFractionDigits:2,maximumFractionDigits:2});
const day=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};

const p=[{sku:"RIC-25",name:"Perfumed Rice 25kg",per:1,price:420,stock:120},{sku:"OIL-12",name:"Vegetable Oil 1L",per:12,price:360,stock:80},{sku:"TOM-24",name:"Tomato Paste 70g",per:24,price:290,stock:12},{sku:"SGR-10",name:"Sugar 1kg",per:10,price:240,stock:60}];

const o=Array.from({length:14},(_,i)=>({id:1001+i,code:c[i%3].code,date:day(6-i%7),status:st[i%7],items:[{sku:p[i%4].sku,name:p[i%4].name,qty:1+i%4,price:p[i%4].price},{sku:p[(i+1)%4].sku,name:p[(i+1)%4].name,qty:1+i%3,price:p[(i+1)%4].price}]}));
return{customers:c,products:p,orders:o,staff:[{name:"Brain Amponsah",role:"Admin"},{name:"Efua Owusu",role:"Sales"},{name:"Kwesi Adjei",role:"Warehouse"}],log:[],seq:1014,low:20}}
const defaults=seed();
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}
if(!db||!Array.isArray(db.customers)||!Array.isArray(db.products)||!Array.isArray(db.orders))db=defaults;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const CAT={RIC:["Grains & Rice","🍚"],OIL:["Oils","🫒"],TOM:["Canned & Sauces","🍅"],SGR:["Baking & Sugar","🍬"],WTR:["Drinks","💧"]};

const S={u:null,v:"shop",q:"",c:"All",stock:"all",sort:"name",fav:false,cart:{},modal:""};

let loginBusy=false;

const pr=s=>db.products.find(x=>x.sku===s),tot=o=>o.items.reduce((s,i)=>s+i.qty*i.price,0);

const V={
shop(){const f=favs(),cats=["All",...new Set(db.products.map(p=>cat(p)[0]))],q=S.q.toLowerCase();

const L=db.products.filter(matches).sort((a,b)=>S.sort==="price"?a.price-b.price:S.sort==="stock"?b.stock-a.stock:S.sort==="reverse-name"?b.name.localeCompare(a.name):a.name.localeCompare(b.name));

const stockButton=(key,label,n)=>`<button class="status-filter ${S.stock===key?"on":""}" data-a="stock" data-id="${key}" aria-pressed="${S.stock===key}"><span>${label}</span><small>${n}</small></button>`;
return`<div class="shop-intro"><div><div class="eyebrow">BoxForLess · Digital product catalog</div><h1>Welcome back, ${esc(S.u.name)}</h1><p>Browse products, check availability, and build your request.</p></div><p><b>${db.products.filter(p=>p.stock>0).length}</b> products available now</p></div>
<div class="shop-layout"><aside class="filters" aria-label="Product filters"><h2>Shop by category</h2><div class="category-list">${categoryButton("All",db.products.length)}${cats.slice(1).map(c=>categoryButton(c,db.products.filter(p=>cat(p)[0]===c).length)).join("")}</div>
<h2>Availability</h2><div class="status-list">${stockButton("all","All",db.products.length)}${stockButton("in","In stock",db.products.filter(p=>p.stock>=db.low).length)}${stockButton("limited","Limited stock",db.products.filter(p=>p.stock>0&&p.stock<db.low).length)}${stockButton("out","Out of stock",db.products.filter(p=>p.stock<1).length)}</div>
<button class="status-filter ${S.fav?"on":""}" data-a="favf" aria-pressed="${S.fav}"><span>♥ Favourites</span><small>${f.length}</small></button></aside>
<section aria-labelledby="catalog-heading"><div class="toolbar"><label><span class="sr">Search products</span><input id="q" type="search" placeholder="⌕  Find a product" value="${esc(S.q)}"></label><label><span class="field-label">Sort products</span><select id="sort"><option value="name" ${S.sort==="name"?"selected":""}>Name A → Z</option><option value="reverse-name" ${S.sort==="reverse-name"?"selected":""}>Name Z → A</option><option value="price" ${S.sort==="price"?"selected":""}>Price: low to high</option><option value="stock" ${S.sort==="stock"?"selected":""}>Stock: high to low</option></select></label></div>
<h2 id="catalog-heading" class="sr">Product results</h2><p class="result-count" aria-live="polite" aria-atomic="true">${L.length?`Showing 1–${L.length} of ${L.length} products`:"No products match these filters"}</p>
<div class="grid">${L.map(p=>`<article class="card p"><button class="fav" data-a="fav" data-id="${p.sku}" aria-label="${f.includes(p.sku)?"Remove "+esc(p.name)+" from favourites":"Add "+esc(p.name)+" to favourites"}" aria-pressed="${f.includes(p.sku)}">${f.includes(p.sku)?"♥":"♡"}</button><div class="product-top"><div class="pic" aria-hidden="true">${cat(p)[1]}</div><span class="pack">CTN ${p.per}</span></div><small class="product-cat">${esc(cat(p)[0])}</small><b class="product-name">${esc(p.name)}</b><small class="mu">SKU ${esc(p.sku)}</small><div class="product-price"><b>${GH(p.price)}</b> <small class="mu">/ carton</small></div><small class="stock-label ${p.stock<1?"out":p.stock<db.low?"limited":""}">${p.stock<1?"Out of stock":p.stock<db.low?"Limited stock · "+p.stock+" left":"In stock"}</small><div class="add"><label class="sr" for="q-${p.sku}">Cartons of ${esc(p.name)}</label><input id="q-${p.sku}" type="number" min="1" max="${p.stock}" value="1" aria-label="Cartons of ${esc(p.name)}"><button class="btn s" data-a="add" data-id="${p.sku}" ${p.stock<1?"disabled":""}>${S.cart[p.sku]?"Add more":"Add to request"}</button></div></article>`).join("")||'<p class="mu">No products found. Try changing your search or filters.</p>'}</div></section></div>`},
orders(){const L=mine();return`<h1>Orders</h1>`+(L.length?L.map(o=>{const i=STEPS.indexOf(o.status);return`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Order #${o.id}</b><span class="tag ${o.status}">${o.status}</span></div><div class="mu">${o.date} · ${o.items.reduce((s,x)=>s+x.qty,0)} cartons · <b style="color:var(--tx)">${GH(tot(o))}</b></div>
${o.status==="Cancelled"?"":`<div class="tl">${STEPS.map((s,k)=>`<div class="${k<=i?"d":""}">${s}</div>`).join("")}</div>`}<p style="margin:10px 0 0"><button class="btn s z" data-a="inv" data-id="${o.id}">Invoice</button> <button class="btn s z" data-a="again" data-id="${o.id}">Reorder</button></p></div>`}).join(""):'<div class="card mu">No orders yet. Your first order will appear here.</div>')},
account(){const u=S.u,pc=Math.min(100,used()/u.credit*100||0);return`<h1>Account</h1><div class="card"><h3 style="margin-top:0">${esc(u.name)}</h3><div class="mu">${esc(u.phone)} · Code <b>${u.code}</b> · ${u.status}</div></div>
<div class="card"><b>Credit</b><div class="bar" style="margin:10px 0"><i style="width:${pc}%"></i></div><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><span>Limit: <b>${GH(u.credit)}</b></span><span>In use: <b>${GH(used())}</b></span><span>Available: <b class="good">${GH(avail())}</b></span></div></div>
<div class="card"><b>Need help?</b><p class="mu" style="margin-bottom:0">Contact your BoxForLess account manager to raise your credit limit or change your details.</p></div>`}};
function cartM(){const L=lines(),t=ctot(),over=t>avail();return`<div class="ov"><div class="md" role="dialog" aria-modal="true" aria-labelledby="cart-title" tabindex="-1"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3 id="cart-title" style="margin:0">My request</h3><small class="mu">${L.length} product${L.length===1?"":"s"} · ${L.reduce((s,i)=>s+i.qty,0)} carton${L.reduce((s,i)=>s+i.qty,0)===1?"":"s"}</small></div><button class="btn s z" data-a="close">Close</button></div>${L.length?`<table><thead><tr><th>Product</th><th>Cartons</th><th class="right">Total</th><th><span class="sr">Remove</span></th></tr></thead><tbody>${L.map(i=>`<tr><td>${esc(i.name)}<br><small class="mu">${GH(i.price)} / carton</small></td><td><input type="number" min="1" max="${pr(i.sku).stock}" value="${i.qty}" data-q="${i.sku}" style="width:76px" aria-label="Cartons of ${esc(i.name)}"></td><td class="right">${GH(i.qty*i.price)}</td><td><button class="btn s z" data-a="rm" data-id="${i.sku}" aria-label="Remove ${esc(i.name)} from request">✕</button></td></tr>`).join("")}</tbody></table>
<p class="right" style="font-size:20px"><b>Estimated total: ${GH(t)}</b></p><p class="right ${over?"bad":"mu"}">Available credit: ${GH(avail())}${over?" (request is over your limit)":""}</p><button class="btn" data-a="place" style="width:100%" ${over||S.u.status!=="Active"?"disabled":""}>Submit request</button>${S.u.status!=="Active"?'<p class="bad">Your account is suspended. Please contact BoxForLess.</p>':""}`:'<p class="mu">Your request is empty. Add products from the catalogue to get started.</p>'}</div></div>`}
function invM(o){return`<div class="ov"><div class="md" role="dialog" aria-modal="true" aria-labelledby="invoice-title" tabindex="-1"><h3 id="invoice-title" style="margin:0">Invoice #${o.id}</h3><p class="mu">BoxForLess Wholesale<br>Billed to: ${esc(S.u.name)} · ${o.date}</p><table><tr><th>Item</th><th>Ctn</th><th>Price</th><th class="right">Total</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${GH(i.price)}</td><td class="right">${GH(i.qty*i.price)}</td></tr>`).join("")}<tr><td colspan="3"><b>Total due</b></td><td class="right"><b>${GH(tot(o))}</b></td></tr></table><p class="no" style="margin-bottom:0"><button class="btn" data-a="print">Print / Save PDF</button> <button class="btn s" data-a="close">Close</button></p></div></div>`}
function render(){const a=$("#app");if(!S.u){a.innerHTML=`<main id="main" tabindex="-1">${login()}</main>`;return}
a.innerHTML=`<header><div class="head-inner"><div class="logo"><svg class="brand-icon" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 36 11v18L20 37 4 29V11L20 3Z"/><path d="m4 11 16 8 16-8M20 19v18"/><path class="mark" d="m16 10 4 2 4-2-4-2-4 2Z"/></svg><span class="brand-name">Box<span>For</span>Less<small class="brand-sub">DIGITAL PRODUCT CATALOG</small></span></div><nav aria-label="Main navigation">${[["shop","Shop"],["orders","Orders"],["account","Account"]].map(([k,l])=>`<button class="${S.v===k?"on":""}" data-a="nav" data-id="${k}" aria-current="${S.v===k?"page":"false"}">${l}</button>`).join("")}</nav><div class="profile"><span class="avatar" aria-hidden="true">${esc(S.u.name.trim().slice(0,1).toUpperCase())}</span><span><b>${esc(S.u.name)}</b><small>Customer account</small></span></div><button class="btn z" data-a="cart" aria-label="My request, ${cnt()} product${cnt()===1?"":"s"}"><span aria-hidden="true">▤</span> My request (${cnt()})</button><button class="btn s z" data-a="out">Log out</button></div></header><main id="main" tabindex="-1">${V[S.v]()}</main>${S.modal}`}
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{if(e.target.id==="sort"){S.sort=e.target.value;render();$("#sort")?.focus();return}const k=e.target.dataset.q;if(k){const n=Math.floor(+e.target.value);if(!(n>0))delete S.cart[k];else S.cart[k]=Math.min(n,pr(k).stock);saveRequest();S.modal=cartM();render();$(`#app [data-q="${k}"]`)?.focus()}});
document.addEventListener("keydown",e=>{if(e.target.id==="cc"&&e.key==="Enter"){e.preventDefault();$("[data-a='login']")?.click();return}if(!S.modal)return;if(e.key==="Escape"){S.modal="";render();restoreModalFocus();return}if(e.key==="Tab"){const d=$("#app .md"),f=[...d.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')];if(!f.length){e.preventDefault();d.focus();return}if(!d.contains(document.activeElement)){e.preventDefault();(e.shiftKey?f[f.length-1]:f[0]).focus()}else if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const wasModal=!!S.modal,opener=document.activeElement,a=b.dataset.a,id=b.dataset.id,loginCode=a==="login"?$("#cc").value:"";
const A={
async login(){if(loginBusy)return;const entered=normalizeCode($("#cc").value);if(!entered)return toast("Enter your access code to continue");
const u=db.customers.find(c=>normalizeCode(customerCode(c))===entered);
if(u){S.u={...u,code:entered};S.v="shop";S.cart=loadRequest(entered);return}
loginBusy=true;const submit=$("[data-a='login']");if(submit){submit.disabled=true;submit.textContent="Checking code…"}
try{const response=await fetch("/api/catalog/access",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:$("#cc").value})});const result=await response.json().catch(()=>({}));
if(!response.ok){toast(result.error||"That access code was not recognised.");return}
window.location.assign("/catalog");return"redirect"
}catch(e){toast("Unable to connect to BoxForLess. Check your connection and try again.")}finally{loginBusy=false}},
out(){S.u=null;S.modal="";S.cart={}},nav(){S.v=id},cat(){S.c=id},stock(){S.stock=id},favf(){S.fav=!S.fav},close(){S.modal=""},print(){window.print()},
fav(){const f=favs(),i=f.indexOf(id);i<0?f.push(id):f.splice(i,1);lsSet("bfl_fav_"+S.u.code,f)},
add(){const p=pr(id),n=Math.floor(+$("#q-"+id).value),t=(S.cart[id]||0)+n;if(!(n>0))return toast("Enter a valid quantity");if(t>p.stock)return toast("Only "+p.stock+" cartons in stock");S.cart[id]=t;saveRequest();toast(p.name+" added to your request")},
cart(){S.modal=cartM()},rm(){delete S.cart[id];saveRequest();S.modal=cartM()},
place(){const L=lines();if(!L.length||S.u.status!=="Active")return;if(ctot()>avail())return toast("Over your credit limit");
for(const i of L)if(pr(i.sku).stock<i.qty)return toast("Not enough stock: "+i.name);
L.forEach(i=>pr(i.sku).stock-=i.qty);const o={id:++db.seq,code:S.u.code,date:day(0),status:"Pending",items:L};db.orders.unshift(o);
db.log.unshift({t:new Date().toLocaleString("en-GH"),u:S.u.name,m:"Order #"+o.id+" placed (customer portal)"});save();S.cart={};saveRequest();S.modal="";S.v="orders";toast("Request #"+o.id+" submitted. We'll confirm shortly.")},
inv(){S.modal=invM(db.orders.find(o=>o.id==id))},
again(){const o=db.orders.find(x=>x.id==id);let miss=0;o.items.forEach(i=>{const p=pr(i.sku);if(p&&p.stock>0)S.cart[i.sku]=Math.min(i.qty,p.stock);else miss++});saveRequest();S.modal=cartM();if(miss)toast(miss+" item(s) no longer available")}};
const result=A[a]?await A[a]():undefined;if(result==="redirect")return;render();if(!wasModal&&S.modal){modalOpener=opener;$("#app .md [data-a='close']")?.focus()}else if(wasModal&&!S.modal)restoreModalFocus();else if(a==="login"&&!S.u){$("#cc").value=loginCode;$("#cc").focus()}else if(a==="nav"||a==="place"||a==="login")$("#main")?.focus();else if(a==="out")$("#cc")?.focus();else if(["fav","favf","cat","stock","add"].includes(a)){[...document.querySelectorAll("[data-a]")].find(x=>x.dataset.a===a&&(id===undefined||x.dataset.id===id))?.focus()}});
render();
</script>
</body>
</html>
