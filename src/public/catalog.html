<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Box for Less — Digital Product Catalog</title>
  <!-- absolute paths: /catalog/product/<id> is a nested URL serving this same shell -->
  <link rel="preload" as="image" href="/img/doodles-bg.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/backdrop.css" />
  <link rel="stylesheet" href="/css/catalog.css" />
</head>
<body>
  <!-- The catalogue is React, mounted here. See js/catalog/. -->
  <div id="root"></div>
  <noscript><p style="padding:16px">The Box for Less catalogue needs JavaScript. Please enable it and reload.</p></noscript>

  <!-- React, ReactDOM and htm are vendored locally (no CDN, no build step). -->
  <script src="/js/boot-guard.js"></script>
  <script src="/vendor/react.min.js"></script>
  <script src="/vendor/react-dom.min.js"></script>
  <script src="/vendor/htm.min.js"></script>
  <script type="module" src="/js/catalog.js"></script>
</body>
</html>
