<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Box for Less</title>
<style>
  :root { --bg: #f6f7f9; --ink: #14233b; --muted: #5b6678; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1726; --ink: #eef2f8; --muted: #9aa6b8; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; padding: 0 16px; }
  main { text-align: center; max-width: 28rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.75rem; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Box for Less</h1>
  <p>Our customer catalogue is coming soon.</p>
</main>
</body>
</html>
