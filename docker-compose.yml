services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      # Persistent SQLite database and product image storage
      - bfl_data:/app/data
    networks:
      - bfl_net
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-catalog.boxforless.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - bfl_net

volumes:
  bfl_data:
    driver: local
  caddy_data:
  caddy_config:

networks:
  bfl_net:
    driver: bridge
